<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonix Rental - Tenant Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .tenant-info {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tenant-details h2 {
            color: #333;
            margin-bottom: 5px;
        }

        .tenant-details p {
            color: #666;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card h3 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .list-item {
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .status-paid {
            color: #38ef7d;
            font-weight: 600;
        }

        .status-pending {
            color: #f5576c;
            font-weight: 600;
        }

        .status-resolved {
            color: #11998e;
            font-weight: 600;
        }

        .status-open {
            color: #f093fb;
            font-weight: 600;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Zonix Rental</h1>
            <p>Tenant Self-Service Portal</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            <div id="loginAlert"></div>
            <div class="form-group">
                <label for="phoneNumber">Enter your phone number</label>
                <input type="tel" id="phoneNumber" placeholder="e.g., 254712345678">
            </div>
            <button class="btn" onclick="login()">Enter Portal</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="dashboard">
            <div class="tenant-info">
                <div class="tenant-details">
                    <h2 id="tenantName">Welcome, Tenant</h2>
                    <p id="unitInfo">Unit: -</p>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showTab('payments')">💳 Pay Rent</button>
                <button class="nav-tab" onclick="showTab('maintenance')">🔧 Maintenance</button>
                <button class="nav-tab" onclick="showTab('extensions')">📅 Extensions</button>
                <button class="nav-tab" onclick="showTab('history')">📊 History</button>
            </div>

            <!-- Payments Tab -->
            <div id="paymentsTab" class="tab-content active">
                <div class="card">
                    <h3>Pay Rent via M-Pesa</h3>
                    <div id="paymentAlert"></div>
                    <div class="info-row">
                        <span class="info-label">Unit Number</span>
                        <span class="info-value" id="unitNumber">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Monthly Rent</span>
                        <span class="info-value" id="rentAmount">KSh 0</span>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="paymentAmount">Amount to Pay</label>
                        <input type="number" id="paymentAmount" placeholder="Enter amount">
                    </div>
                    <div class="form-group">
                        <label for="paymentPhone">M-Pesa Phone Number</label>
                        <input type="tel" id="paymentPhone" placeholder="e.g., 254712345678">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn btn-success" id="payBtn" onclick="initiatePayment()">
                            Pay via M-Pesa
                        </button>
                        <button class="btn btn-warning" id="testBtn" onclick="simulatePayment()">
                            Simulate Successful Payment (Demo)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Maintenance Tab -->
            <div id="maintenanceTab" class="tab-content">
                <div class="card">
                    <h3>Request Maintenance</h3>
                    <div id="maintenanceAlert"></div>
                    <div class="form-group">
                        <label for="ticketTitle">Issue Title</label>
                        <input type="text" id="ticketTitle" placeholder="e.g., Leaking faucet">
                    </div>
                    <div class="form-group">
                        <label for="ticketCategory">Category</label>
                        <select id="ticketCategory">
                            <option value="PLUMBING">Plumbing</option>
                            <option value="ELECTRICAL">Electrical</option>
                            <option value="STRUCTURAL">Structural</option>
                            <option value="APPLIANCES">Appliances</option>
                            <option value="PEST_CONTROL">Pest Control</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ticketDescription">Description</label>
                        <textarea id="ticketDescription" rows="4" placeholder="Describe the issue in detail..."></textarea>
                    </div>
                    <button class="btn btn-warning" onclick="submitMaintenanceRequest()">
                        Submit Request
                    </button>
                </div>
                <div class="card">
                    <h3>My Maintenance Requests</h3>
                    <div id="maintenanceList"></div>
                </div>
            </div>

            <!-- Extensions Tab -->
            <div id="extensionsTab" class="tab-content">
                <div class="card">
                    <h3>Request Payment Extension</h3>
                    <div id="extensionAlert"></div>
                    <div class="form-group">
                        <label for="promisedDate">Promised Payment Date</label>
                        <input type="date" id="promisedDate">
                    </div>
                    <div class="form-group">
                        <label for="extensionReason">Reason for Extension</label>
                        <textarea id="extensionReason" rows="4" placeholder="Explain why you need an extension..."></textarea>
                    </div>
                    <button class="btn" onclick="submitExtensionRequest()">
                        Request Extension
                    </button>
                </div>
                <div class="card">
                    <h3>My Extension Requests</h3>
                    <div id="extensionsList"></div>
                </div>
            </div>

            <!-- History Tab -->
            <div id="historyTab" class="tab-content">
                <div class="card">
                    <h3>Payment History</h3>
                    <div id="paymentHistory"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTenant = null;
        let currentUnit = null;

        const API_BASE = '/api/v1';

        function login() {
            const phone = document.getElementById('phoneNumber').value.trim();
            if (!phone) {
                showAlert('loginAlert', 'Please enter your phone number', 'error');
                return;
            }

            fetch(`/tenant-portal/api/tenant/${phone}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentTenant = data.tenant;
                        currentUnit = data.unit;
                        showDashboard(data);
                    } else {
                        showAlert('loginAlert', data.message || 'Tenant not found', 'error');
                    }
                })
                .catch(err => {
                    showAlert('loginAlert', 'Error connecting to server', 'error');
                    console.error(err);
                });
        }

        function showDashboard(data) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
            
            document.getElementById('tenantName').textContent = `Welcome, ${data.tenant.fullname}`;
            if (data.unit) {
                document.getElementById('unitInfo').textContent = `Unit: ${data.unit.unitNumber} (Floor ${data.unit.floor})`;
                document.getElementById('unitNumber').textContent = data.unit.unitNumber;
                document.getElementById('rentAmount').textContent = `KSh ${data.unit.rentAmount.toLocaleString()}`;
                document.getElementById('paymentAmount').value = data.unit.rentAmount;
                document.getElementById('paymentPhone').value = data.tenant.phoneNumber;
            }

            loadMaintenanceList(data.tickets || []);
            loadExtensionsList(data.extensions || []);
            loadPaymentHistory(data.payments || []);
        }

        function logout() {
            currentTenant = null;
            currentUnit = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('phoneNumber').value = '';
        }

        function showTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        function initiatePayment() {
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            const phone = document.getElementById('paymentPhone').value.trim();

            if (!amount || amount <= 0) {
                showAlert('paymentAlert', 'Please enter a valid amount', 'error');
                return;
            }
            if (!phone) {
                showAlert('paymentAlert', 'Please enter your M-Pesa phone number', 'error');
                return;
            }

            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            fetch(`${API_BASE}/daraja/stkpush`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: phone,
                    amount: amount,
                    accountReference: currentUnit ? currentUnit.unitNumber : 'RENT',
                    transactionDesc: 'Rent Payment',
                    unitId: currentUnit ? currentUnit.id : null
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert('paymentAlert', 
                        `STK Push sent! Please check your phone. Checkout Request ID: ${data.checkoutRequestId}`, 
                        'info');
                    pollTransactionStatus(data.checkoutRequestId);
                } else {
                    showAlert('paymentAlert', data.message || 'Payment failed', 'error');
                }
            })
            .catch(err => {
                showAlert('paymentAlert', 'Error initiating payment', 'error');
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Pay via M-Pesa';
            });
        }

        function pollTransactionStatus(checkoutRequestId) {
            const pollInterval = setInterval(() => {
                fetch(`${API_BASE}/daraja/status/${checkoutRequestId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.data) {
                            const resultCode = data.data.ResultCode;
                            if (resultCode === 0) {
                                clearInterval(pollInterval);
                                showAlert('paymentAlert', 'Payment successful!', 'success');
                                refreshTenantData();
                            } else if (resultCode !== null && resultCode !== undefined) {
                                clearInterval(pollInterval);
                                showAlert('paymentAlert', `Payment failed: ${data.data.ResultDesc}`, 'error');
                            }
                        }
                    })
                    .catch(err => console.error(err));
            }, 5000);

            setTimeout(() => clearInterval(pollInterval), 120000);
        }

        function simulatePayment() {
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            const btn = document.getElementById('testBtn');
            
            if (!amount || amount <= 0) {
                showAlert('paymentAlert', 'Please enter a valid amount', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';

            fetch('/tenant-portal/api/simulate-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: currentTenant.phoneNumber,
                    amount: amount,
                    unitId: currentUnit ? currentUnit.id : null,
                    mpesaRef: 'SIM' + Date.now()
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert('paymentAlert', '✅ Payment simulated successfully! Receipt: ' + data.mpesaRef, 'success');
                    refreshTenantData();
                } else {
                    showAlert('paymentAlert', data.message || 'Simulation failed', 'error');
                }
            })
            .catch(err => {
                showAlert('paymentAlert', 'Error simulating payment', 'error');
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Simulate Successful Payment (Demo)';
            });
        }

        function submitMaintenanceRequest() {
            const title = document.getElementById('ticketTitle').value.trim();
            const category = document.getElementById('ticketCategory').value;
            const description = document.getElementById('ticketDescription').value.trim();

            if (!title || !description) {
                showAlert('maintenanceAlert', 'Please fill in all fields', 'error');
                return;
            }

            fetch('/tenant-portal/api/maintenance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: currentTenant.phoneNumber,
                    title: title,
                    category: category,
                    description: description
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert('maintenanceAlert', 'Maintenance request submitted successfully!', 'success');
                    document.getElementById('ticketTitle').value = '';
                    document.getElementById('ticketDescription').value = '';
                    refreshTenantData();
                } else {
                    showAlert('maintenanceAlert', data.message || 'Failed to submit request', 'error');
                }
            })
            .catch(err => {
                showAlert('maintenanceAlert', 'Error submitting request', 'error');
                console.error(err);
            });
        }

        function submitExtensionRequest() {
            const promisedDate = document.getElementById('promisedDate').value;
            const reason = document.getElementById('extensionReason').value.trim();

            if (!promisedDate || !reason) {
                showAlert('extensionAlert', 'Please fill in all fields', 'error');
                return;
            }

            fetch('/tenant-portal/api/extension', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phoneNumber: currentTenant.phoneNumber,
                    promisedPaymentDate: promisedDate,
                    reason: reason
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showAlert('extensionAlert', 'Extension request submitted successfully!', 'success');
                    document.getElementById('promisedDate').value = '';
                    document.getElementById('extensionReason').value = '';
                    refreshTenantData();
                } else {
                    showAlert('extensionAlert', data.message || 'Failed to submit request', 'error');
                }
            })
            .catch(err => {
                showAlert('extensionAlert', 'Error submitting request', 'error');
                console.error(err);
            });
        }

        function refreshTenantData() {
            fetch(`/tenant-portal/api/tenant/${currentTenant.phoneNumber}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadMaintenanceList(data.tickets || []);
                        loadExtensionsList(data.extensions || []);
                        loadPaymentHistory(data.payments || []);
                    }
                });
        }

        function loadMaintenanceList(tickets) {
            const container = document.getElementById('maintenanceList');
            if (tickets.length === 0) {
                container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">No maintenance requests yet</p>';
                return;
            }

            container.innerHTML = tickets.map(ticket => `
                <div class="list-item">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <strong>${ticket.title || ticket.ticketNumber || 'Maintenance Request'}</strong>
                        <span class="status-${(ticket.status || 'PENDING').toLowerCase()}">${ticket.status || 'PENDING'}</span>
                    </div>
                    <p style="color:#666;margin-bottom:5px;">${ticket.description || ''}</p>
                    <small style="color:#999;">Category: ${ticket.category || ''} | ${ticket.reportedDate || ticket.reportedAt || ''}</small>
                </div>
            `).join('');
        }

        function loadExtensionsList(extensions) {
            const container = document.getElementById('extensionsList');
            if (extensions.length === 0) {
                container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">No extension requests yet</p>';
                return;
            }

            container.innerHTML = extensions.map(ext => `
                <div class="list-item">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <strong>Extension Request</strong>
                        <span class="status-${(ext.status || 'PENDING').toLowerCase()}">${ext.status || 'PENDING'}</span>
                    </div>
                    <p style="color:#666;margin-bottom:5px;">${ext.reason || ''}</p>
                    <small style="color:#999;">Promised: ${ext.promisedPaymentDate || ext.expectedPaymentDate || ''}</small>
                </div>
            `).join('');
        }

        function loadPaymentHistory(payments) {
            const container = document.getElementById('paymentHistory');
            if (payments.length === 0) {
                container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">No payments yet</p>';
                return;
            }

            container.innerHTML = payments.map(payment => `
                <div class="list-item">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <strong>Payment</strong>
                        <span class="status-paid">${payment.status || 'PAID'}</span>
                    </div>
                    <p style="color:#666;margin-bottom:5px;">Amount: KSh ${(payment.amount || 0).toLocaleString()}</p>
                    <small style="color:#999;">Receipt: ${payment.mpesaRef || payment.mpesaReceiptNumber || ''} | ${payment.paymentDate || ''}</small>
                    <small style="color:#666;display:block;margin-top:5px;">Covers: ${payment.coversFrom || ''} - ${payment.coversUntil || ''}</small>
                </div>
            `).join('');
        }

        function showAlert(elementId, message, type) {
            const alertEl = document.getElementById(elementId);
            alertEl.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertEl.innerHTML = '', 5000);
        }

        // Handle Enter key in login
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
